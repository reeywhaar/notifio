name: Notify through notifio
description: Send a message through a notifio instance.

# A token is issued for one channel and the channel pins its destination, so a caller needs the
# address, the credential, and the message. Nothing here says where it goes.
#
# Usable from another repository as:
#   uses: reeywhaar/notifio/ghactions/notify@main

inputs:
  host:
    description: Base URL of the notifio instance, e.g. https://notify.example.com
    required: true
  token:
    description: A notifio token. The channel it was issued for decides where this lands
    required: true
  body:
    description: The message
    required: true
  body-type:
    description: >-
      plain, md or html. md is CommonMark and notifio renders it for whichever channel the
      token points at, so it is the one that works against both without knowing which.
    required: false
    default: md
  subject:
    description: >-
      A header on an email channel and a bold title on a telegram one, so it is safe to set
      either way. Empty sends none, and an email channel then says "No subject".
    required: false
    default: ""
  link-preview:
    description: >-
      Whether Telegram renders a preview card for a link in the body. Empty sends nothing about
      it, which is the only value an email channel accepts — a notifier channel is better off
      pinning "link_preview": false in its config than passing it here.
    required: false
    default: ""

outputs:
  id:
    description: The provider's message id — a Telegram message_id, or an email Message-ID.
    value: ${{ steps.send.outputs.id }}

runs:
  using: composite
  steps:
    - name: Send
      id: send
      shell: bash
      env:
        NOTIFIO_HOST: ${{ inputs.host }}
        NOTIFIO_TOKEN: ${{ inputs.token }}
        NOTIFIO_BODY: ${{ inputs.body }}
        NOTIFIO_BODY_TYPE: ${{ inputs.body-type }}
        NOTIFIO_SUBJECT: ${{ inputs.subject }}
        NOTIFIO_LINK_PREVIEW: ${{ inputs.link-preview }}
      run: ${{ github.action_path }}/notify.sh
